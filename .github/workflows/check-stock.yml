name: Stock Check

on:
  repository_dispatch:
    # cron-job.org から GitHub API 経由でこのイベントを送ってもらうことで起動する。
    # event_type は cron-job.org 側のリクエストボディと一致させる必要がある。
    types: [stock-check]
  workflow_dispatch: {}  # 手動実行(Actionsタブの「Run workflow」)用

permissions:
  contents: write  # データファイルをコミットするために必要

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_stock.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stock_history.csv
          git diff --staged --quiet || git commit -m "在庫データ更新 $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
